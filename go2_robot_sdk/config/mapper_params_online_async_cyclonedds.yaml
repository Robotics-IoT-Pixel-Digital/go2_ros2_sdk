slam_toolbox:
  ros__parameters:

    # ------------------
    # Timing (STABIL > CEPAT)
    # ------------------
    throttle_scans: 1
    minimum_time_interval: 0.12      # ⬅️ ~8 Hz efektif
    transform_publish_period: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 20.0

    # ------------------
    # Map
    # ------------------
    resolution: 0.05
    max_laser_range: 12.0             # ⬅️ PENTING
    map_update_interval: 1.0

    # ------------------
    # Scan Matching
    # ------------------
    use_scan_matching: true
    use_scan_barycenter: false

    minimum_travel_distance: 0.25     # ⬅️ lebih konservatif
    minimum_travel_heading: 0.15

    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 6.0

    link_scan_maximum_distance: 0.8
    link_match_minimum_response_fine: 0.35   # ⬅️ lebih ketat

    # ------------------
    # Loop Closure
    # ------------------
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 12
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.6

    # ------------------
    # Correlation (LEBIH KETAT)
    # ------------------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.03

    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.02

    # ------------------
    # Penalties (TOLAK MATCH JELEK)
    # ------------------
    distance_variance_penalty: 1.5
    angle_variance_penalty: 2.0

    fine_search_angle_offset: 0.015
    coarse_search_angle_offset: 0.3
    coarse_angle_resolution: 0.025

    minimum_angle_penalty: 1.0
    minimum_distance_penalty: 0.8
    use_response_expansion: false     # ⬅️ stop cari match paksa

    enable_interactive_mode: false
